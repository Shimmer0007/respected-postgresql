services:
  db:
    image: postgres:16
    container_name: blockworld-postgres
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner
      POSTGRES_DB: blockworld
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/workspace/sql:ro
      - blockworld_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d blockworld"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  blockworld_pgdata:
